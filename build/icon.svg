<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset=".45" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8a6a17"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26232b"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- outer gold shield -->
  <path d="M256 22 L448 92 V244 C448 362 368 444 256 492 C144 444 64 362 64 244 V92 Z" fill="url(#gold)"/>
  <!-- inner dark glass shield -->
