    <path d="M170 214 a120 120 0 0 1 172 0"/>
    <path d="M200 248 a76 76 0 0 1 112 0"/>
  </g>
  <!-- key / node -->
  <circle cx="256" cy="292" r="30" fill="url(#gold)"/>
