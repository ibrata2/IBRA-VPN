name: Free servers profile

# Refreshes profiles/free.json (sing-box profile for iPhone/Android) every 6 hours.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Get sing-box
        run: |
          V=1.14.4
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v$V/sing-box-$V-linux-amd64.tar.gz" | tar xz
          mv sing-box-$V-linux-amd64/sing-box ./sb
      - run: node scripts/free-profile.js ./sb
      - name: Commit
        run: |
          git config user.name "IBRA VPN bot"
          git config user.email "ibraprogram@users.noreply.github.com"
          git add profiles/free.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh free servers profile"
          git push
